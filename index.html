<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Mystery Shopping & Nebeneinkünfte verwalten – modern, offline-fähig, kostenlos.">

  <!-- PWA -->
  <meta name="theme-color" content="#0D1B2A" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F0F4F8" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="manifest.json">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nebeneink.">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">

  <title>Nebeneinkünfte Tracker</title>
  <link rel="stylesheet" href="src/styles/main.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>

<div id="app">

  <!-- Header -->
  <header id="app-header">
    <a class="header-logo" href="#" onclick="window.app?.navigate('dashboard');return false;">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
        <rect width="28" height="28" rx="8" fill="#00B4D8" fill-opacity="0.15"/>
        <text x="14" y="20" font-size="16" text-anchor="middle" fill="#00B4D8">€</text>
      </svg>
      <span>Neben<span class="accent">eink.</span></span>
    </a>
    <div class="header-actions">
      <button id="theme-toggle" class="btn btn-ghost btn-icon" title="Theme wechseln" aria-label="Theme wechseln">
        ☀️
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main id="app-content" role="main">
    <!-- Wird durch app.js befüllt -->
    <div class="empty-state">
      <div class="spinner"></div>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav id="app-nav" role="navigation" aria-label="Hauptnavigation">
    <button class="nav-item active" data-view="dashboard" aria-label="Dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span>Dashboard</span>
    </button>

    <button class="nav-item" data-view="assignments" aria-label="Aufträge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
        <rect x="9" y="3" width="6" height="4" rx="1"/>
        <line x1="9" y1="12" x2="15" y2="12"/>
        <line x1="9" y1="16" x2="12" y2="16"/>
      </svg>
      <span>Aufträge</span>
    </button>

    <button class="nav-item" data-view="analytics" aria-label="Auswertungen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"/>
        <line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6" y1="20" x2="6" y2="14"/>
        <line x1="2" y1="20" x2="22" y2="20"/>
      </svg>
      <span>Berichte</span>
    </button>

    <button class="nav-item" data-view="clients" aria-label="Auftraggeber">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 00-3-3.87"/>
        <path d="M16 3.13a4 4 0 010 7.75"/>
      </svg>
      <span>Auftragg.</span>
    </button>

    <button class="nav-item" data-view="settings" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
      <span>Einstellg.</span>
    </button>
  </nav>

  <!-- FAB (Floating Action Button) – für neuen Auftrag -->
  <button id="fab" class="fab" aria-label="Neuer Auftrag" style="display:none" title="Neuen Auftrag anlegen">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>

  <!-- Toast Container -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

</div>

<script type="module" src="src/app.js"></script>
</body>
</html>
